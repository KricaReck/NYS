<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Cigarrería</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6">
        <h1 class="text-xl font-bold mb-2 text-center text-gray-800">Inventario Cigarrería</h1>
        <p id="status-msg" class="text-sm text-center text-gray-500 mb-4">Escanea un código de barras</p>
        
        <!-- Contenedor de la cámara -->
        <div id="reader" class="w-full mb-4"></div>
        
        <!-- Controles -->
        <div class="flex gap-2 mb-4">
            <button id="start-btn" onclick="startScanner()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 flex-1 font-semibold">Iniciar Cámara</button>
            <button id="stop-btn" onclick="stopScanner()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 flex-1 hidden font-semibold">Detener</button>
        </div>

        <!-- MODAL / FORMULARIO PARA PRODUCTO NUEVO -->
        <div id="product-modal" class="hidden bg-yellow-50 border border-yellow-300 p-4 rounded-lg mb-4">
            <h2 class="font-bold text-yellow-800 mb-2">Nuevo Producto Detectado</h2>
            <p class="text-xs text-gray-600 mb-2">Código: <span id="modal-code" class="font-mono font-bold"></span></p>
            <input type="text" id="prod-name" placeholder="Nombre (ej. Cerveza Águila 330ml)" class="w-full border p-2 mb-2 rounded text-sm">
            <input type="text" id="prod-cat" placeholder="Categoría (ej. Cervezas)" class="w-full border p-2 mb-2 rounded text-sm">
            <div class="flex gap-2 mb-2">
                <input type="number" id="prod-buy" placeholder="P. Compra" class="w-1/2 border p-2 rounded text-sm">
                <input type="number" id="prod-sell" placeholder="P. Venta" class="w-1/2 border p-2 rounded text-sm">
            </div>
            <input type="number" id="prod-qty" placeholder="Cantidad inicial" value="1" class="w-full border p-2 mb-2 rounded text-sm">
            <button onclick="saveNewProduct()" class="bg-blue-600 text-white w-full py-2 rounded font-semibold text-sm">Guardar y Continuar Escaneando</button>
        </div>

        <!-- Resumen Rápido -->
        <div class="flex justify-between items-center mb-2">
            <h2 class="text-md font-semibold text-gray-700">Inventario Registrado</h2>
            <span id="total-items" class="text-sm bg-gray-200 px-2 py-1 rounded font-bold">0 refs</span>
        </div>
        
        <div class="overflow-x-auto max-h-60 overflow-y-auto mb-4 border rounded">
            <table class="w-full border-collapse text-sm">
                <thead>
                    <tr class="bg-gray-200 sticky top-0">
                        <th class="p-2 text-left">Producto</th>
                        <th class="p-2 text-center">Cant.</th>
                        <th class="p-2 text-right">P. Venta</th>
                    </tr>
                </thead>
                <tbody id="inventory-table">
                    <!-- Filas dinámicas -->
                </tbody>
            </table>
        </div>
        
        <button onclick="exportCSV()" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 w-full font-semibold">Exportar Inventario CSV</button>
    </div>

    <script>
        let html5QrCode;
        let inventory = JSON.parse(localStorage.getItem('cigarreria_inv')) || {};
        let lastScannedCode = "";
        let isProcessing = false;
        let pendingCode = "";

        updateTable();

        function startScanner() {
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 15, qrbox: { width: 250, height: 150 } };
            
            html5QrCode.start({ facingMode: "environment" }, config, (decodedText) => {
                if (isProcessing) return; // Evita lecturas encimadas
                
                // Bloqueo temporal para evitar conteo múltiple del mismo código seguidos
                if (decodedText === lastScannedCode) return;

                handleScan(decodedText);
            }, () => {}).then(() => {
                document.getElementById('start-btn').classList.add('hidden');
                document.getElementById('stop-btn').classList.remove('hidden');
            }).catch(err => alert("Error de cámara: " + err));
        }

        function stopScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('start-btn').classList.remove('hidden');
                    document.getElementById('stop-btn').classList.add('hidden');
                });
            }
        }

        function handleScan(code) {
            lastScannedCode = code;
            // Limpia el bloqueo de lectura repetida despues de 3 segundos
            setTimeout(() => { lastScannedCode = ""; }, 3000);

            if (inventory[code]) {
                // Si ya existe, solo suma 1 de forma ágil
                inventory[code].quantity += 1;
                saveStorage();
                updateTable();
                showStatus(`+1 Agregado a: ${inventory[code].name}`, "text-green-600");
            } else {
                // Si no existe, pausa el escáner y abre el formulario de registro
                isProcessing = true;
                pendingCode = code;
                stopScanner();
                document.getElementById('modal-code').innerText = code;
                document.getElementById('product-modal').classList.remove('hidden');
                document.getElementById('prod-name').focus();
            }
        }

        function saveNewProduct() {
            const name = document.getElementById('prod-name').value.trim();
            const category = document.getElementById('prod-cat').value.trim();
            const buyPrice = parseFloat(document.getElementById('prod-buy').value) || 0;
            const sellPrice = parseFloat(document.getElementById('prod-sell').value) || 0;
            const qty = parseInt(document.getElementById('prod-qty').value) || 1;

            if (!name) {
                alert("Por lo menos escribe el nombre del producto.");
                return;
            }

            inventory[pendingCode] = {
                code: pendingCode,
                name: name,
                category: category,
                buyPrice: buyPrice,
                sellPrice: sellPrice,
                quantity: qty
            };

            saveStorage();
            updateTable();

            // Limpiar formulario y ocultar modal
            document.getElementById('prod-name').value = '';
            document.getElementById('prod-cat').value = '';
            document.getElementById('prod-buy').value = '';
            document.getElementById('prod-sell').value = '';
            document.getElementById('prod-qty').value = '1';
            document.getElementById('product-modal').classList.add('hidden');
            
            isProcessing = false;
            startScanner(); // Reanuda la cámara automáticamente
        }

        function showStatus(text, colorClass) {
            const msg = document.getElementById('status-msg');
            msg.innerText = text;
            msg.className = `text-sm text-center font-semibold mb-4 ${colorClass}`;
            setTimeout(() => {
                msg.innerText = "Escanea un código de barras";
                msg.className = "text-sm text-center text-gray-500 mb-4";
            }, 2500);
        }

        function updateTable() {
            const tbody = document.getElementById('inventory-table');
            tbody.innerHTML = '';
            let count = 0;
            for (let code in inventory) {
                count++;
                const item = inventory[code];
                tbody.innerHTML += `
                    <tr class="border-b">
                        <td class="p-2">
                            <div class="font-bold">${item.name}</div>
                            <div class="text-xs text-gray-500">${item.code}</div>
                        </td>
                        <td class="p-2 text-center font-bold text-blue-600">${item.quantity}</td>
                        <td class="p-2 text-right">$${item.sellPrice}</td>
                    </tr>
                `;
            }
            document.getElementById('total-items').innerText = `${count} refs`;
        }

        function saveStorage() {
            localStorage.setItem('cigarreria_inv', JSON.stringify(inventory));
        }

        function exportCSV() {
            let csvContent = "data:text/csv;charset=utf-8,Codigo,Nombre,Categoria,P.Compra,P.Venta,Cantidad\n";
            for (let code in inventory) {
                const item = inventory[code];
                csvContent += `${item.code},"${item.name}","${item.category}",${item.buyPrice},${item.sellPrice},${item.quantity}\n`;
            }
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "inventario_cigarreria.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
