<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Cigarreria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6">
        <h1 class="text-xl font-bold mb-2 text-center text-gray-800">Inventario Cigarrería</h1>
        <p id="status-msg" class="text-sm text-center text-gray-500 mb-4">Escanea un código de barras</p>
        
        <!-- Contenedor de la cámara -->
        <div id="reader" class="w-full mb-4 rounded-lg overflow-hidden border"></div>
        
        <!-- Controles de Cámara y Flash -->
        <div class="grid grid-cols-2 gap-2 mb-4">
            <button id="start-btn" onclick="startScanner()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 font-semibold text-sm">Iniciar Cámara</button>
            <button id="stop-btn" onclick="stopScanner()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 hidden font-semibold text-sm">Detener</button>
            <button id="flash-btn" onclick="toggleFlash()" class="bg-amber-500 text-white px-4 py-2 rounded hover:bg-amber-600 hidden font-semibold text-sm col-span-2">Flash: OFF</button>
        </div>

        <!-- MODAL / FORMULARIO PARA PRODUCTO NUEVO -->
        <div id="product-modal" class="hidden bg-yellow-50 border border-yellow-300 p-4 rounded-lg mb-4">
            <h2 class="font-bold text-yellow-800 mb-2">Nuevo Producto Detectado</h2>
            <p class="text-xs text-gray-600 mb-2">Código: <span id="modal-code" class="font-mono font-bold"></span></p>
            <input type="text" id="prod-name" placeholder="Nombre (ej. Cerveza Águila 330ml)" class="w-full border p-2 mb-2 rounded text-sm">
            <input type="text" id="prod-cat" placeholder="Categoría (ej. Cervezas)" class="w-full border p-2 mb-2 rounded text-sm">
            <div class="flex gap-2 mb-2">
                <input type="number" id="prod-buy" placeholder="P. Compra" class="w-1/2 border p-2 rounded text-sm">
                <input type="number" id="prod-sell" placeholder="P. Venta" class="w-1/2 border p-2 rounded text-sm">
            </div>
            <input type="number" id="prod-qty" placeholder="Cantidad inicial" value="1" class="w-full border p-2 mb-2 rounded text-sm">
            <button onclick="saveNewProduct()" class="bg-blue-600 text-white w-full py-2 rounded font-semibold text-sm">Guardar y Sincronizar</button>
        </div>

        <!-- MODAL PARA EDITAR PRODUCTO EXISTENTE -->
        <div id="edit-modal" class="hidden bg-blue-50 border border-blue-300 p-4 rounded-lg mb-4">
            <h2 class="font-bold text-blue-800 mb-2">Editar Producto</h2>
            <input type="hidden" id="edit-code">
            <input type="text" id="edit-name" placeholder="Nombre" class="w-full border p-2 mb-2 rounded text-sm">
            <input type="text" id="edit-cat" placeholder="Categoría" class="w-full border p-2 mb-2 rounded text-sm">
            <div class="flex gap-2 mb-2">
                <input type="number" id="edit-buy" placeholder="P. Compra" class="w-1/2 border p-2 rounded text-sm">
                <input type="number" id="edit-sell" placeholder="P. Venta" class="w-1/2 border p-2 rounded text-sm">
            </div>
            <input type="number" id="edit-qty" placeholder="Cantidad" class="w-full border p-2 mb-2 rounded text-sm">
            <div class="flex gap-2">
                <button onclick="updateEditedProduct()" class="bg-green-600 text-white w-full py-2 rounded font-semibold text-sm">Actualizar</button>
                <button onclick="closeEditModal()" class="bg-gray-400 text-white w-full py-2 rounded font-semibold text-sm">Cancelar</button>
            </div>
        </div>

        <!-- Resumen Rápido -->
        <div class="flex justify-between items-center mb-2">
            <h2 class="text-md font-semibold text-gray-700">Inventario Registrado</h2>
            <span id="total-items" class="text-sm bg-gray-200 px-2 py-1 rounded font-bold">0 refs</span>
        </div>
        
        <div class="overflow-x-auto max-h-72 overflow-y-auto mb-4 border rounded bg-white">
            <table class="w-full border-collapse text-sm">
                <thead>
                    <tr class="bg-gray-200 sticky top-0">
                        <th class="p-2 text-left">Producto</th>
                        <th class="p-2 text-center">Cant.</th>
                        <th class="p-2 text-right">Acciones</th>
                    </tr>
                </thead>
                <tbody id="inventory-table">
                    <!-- Filas dinámicas -->
                </tbody>
            </table>
        </div>
        
        <button onclick="exportCSV()" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 w-full font-semibold">Exportar Inventario CSV</button>
    </div>

    <script>
        // URL de tu Google Apps Script proporcionada
        const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbz_O2OPz_PIVUqYRWdEonCE8mOuUJjeF5-4cPccKD9omhBRNqa7QABHvGIsar2eFe0/exec";

        let html5QrCode;
        let inventory = JSON.parse(localStorage.getItem('cigarreria_inv')) || {};
        let lastScannedCode = "";
        let isProcessing = false;
        let pendingCode = "";
        let flashOn = false;
        let videoTrack = null;

        updateTable();

        function startScanner() {
            html5QrCode = new Html5Qrcode("reader");
            
            const config = { 
                fps: 20, 
                qrbox: { width: 280, height: 140 },
                aspectRatio: 1.0,
                formatsToSupport: [ 
                    Html5QrcodeSupportedFormats.EAN_13, 
                    Html5QrcodeSupportedFormats.EAN_8, 
                    Html5QrcodeSupportedFormats.UPC_A, 
                    Html5QrcodeSupportedFormats.UPC_E, 
                    Html5QrcodeSupportedFormats.CODE_128,
                    Html5QrcodeSupportedFormats.QR_CODE 
                ]
            };
            
            html5QrCode.start({ facingMode: "environment" }, config, (decodedText) => {
                if (isProcessing) return; 
                if (decodedText === lastScannedCode) return;

                handleScan(decodedText);
            }, () => {}).then(() => {
                document.getElementById('start-btn').classList.add('hidden');
                document.getElementById('stop-btn').classList.remove('hidden');
                
                try {
                    const qrBoxElement = html5QrCode.getRunningTrack();
                    if (qrBoxElement) {
                        videoTrack = qrBoxElement;
                        const capabilities = videoTrack.getCapabilities();
                        if (capabilities && capabilities.torch) {
                            document.getElementById('flash-btn').classList.remove('hidden');
                        }
                    }
                } catch(e) {
                    console.log("Error obteniendo track para flash", e);
                }

            }).catch(err => alert("Error de cámara: " + err));
        }

        function stopScanner() {
            if (flashOn) toggleFlash();
            
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('start-btn').classList.remove('hidden');
                    document.getElementById('stop-btn').classList.add('hidden');
                    document.getElementById('flash-btn').classList.add('hidden');
                    videoTrack = null;
                });
            }
        }

        function toggleFlash() {
            if (!videoTrack) {
                try {
                    videoTrack = html5QrCode.getRunningTrack();
                } catch(e) {}
            }

            if (videoTrack) {
                flashOn = !flashOn;
                videoTrack.applyConstraints({
                    advanced: [{ torch: flashOn }]
                }).then(() => {
                    const btn = document.getElementById('flash-btn');
                    if (flashOn) {
                        btn.innerText = "Flash: ON";
                        btn.className = "bg-amber-600 text-white px-4 py-2 rounded font-semibold text-sm col-span-2 ring-2 ring-amber-300";
                    } else {
                        btn.innerText = "Flash: OFF";
                        btn.className = "bg-amber-500 text-white px-4 py-2 rounded font-semibold text-sm col-span-2";
                    }
                }).catch(err => {
                    alert("Tu dispositivo no permitió activar la linterna.");
                    flashOn = !flashOn;
                });
            } else {
                alert("La cámara no está activa.");
            }
        }

        function handleScan(code) {
            lastScannedCode = code;
            setTimeout(() => { lastScannedCode = ""; }, 5000); // Bloqueo de 5 segundos

            if (inventory[code]) {
                inventory[code].quantity += 1;
                saveStorage();
                updateTable();
                showStatus(`+1 Agregado a: ${inventory[code].name}`, "text-green-600");
            } else {
                isProcessing = true;
                pendingCode = code;
                stopScanner();
                document.getElementById('modal-code').innerText = code;
                document.getElementById('product-modal').classList.remove('hidden');
                document.getElementById('prod-name').focus();
            }
        }

        function saveNewProduct() {
            const name = document.getElementById('prod-name').value.trim();
            const category = document.getElementById('prod-cat').value.trim();
            const buyPrice = parseFloat(document.getElementById('prod-buy').value) || 0;
            const sellPrice = parseFloat(document.getElementById('prod-sell').value) || 0;
            const qty = parseInt(document.getElementById('prod-qty').value) || 1;

            if (!name) {
                alert("Por lo menos escribe el nombre del producto.");
                return;
            }

            inventory[pendingCode] = {
                code: pendingCode,
                name: name,
                category: category,
                buyPrice: buyPrice,
                sellPrice: sellPrice,
                quantity: qty
            };

            saveStorage();
            updateTable();

            // Enviar datos a Google Sheets de manera asíncrona
            syncToGoogleSheets({
                'Codigo': pendingCode,
                'Nombre': name,
                'Categoria': category,
                'P.Compra': buyPrice,
                'P.Venta': sellPrice,
                'Cantidad': qty
            });

            document.getElementById('prod-name').value = '';
            document.getElementById('prod-cat').value = '';
            document.getElementById('prod-buy').value = '';
            document.getElementById('prod-sell').value = '';
            document.getElementById('prod-qty').value = '1';
            document.getElementById('product-modal').classList.add('hidden');
            
            isProcessing = false;
            startScanner(); 
        }

        function syncToGoogleSheets(data) {
            fetch(GOOGLE_SHEET_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams(data)
            }).catch(err => console.log("Error al sincronizar con Sheets:", err));
        }

        function editProduct(code) {
            const item = inventory[code];
            if (!item) return;

            if (html5QrCode && document.getElementById('stop-btn').classList.contains('hidden') == false) {
                stopScanner();
            }

            document.getElementById('edit-code').value = code;
            document.getElementById('edit-name').value = item.name;
            document.getElementById('edit-cat').value = item.category || '';
            document.getElementById('edit-buy').value = item.buyPrice || 0;
            document.getElementById('edit-sell').value = item.sellPrice || 0;
            document.getElementById('edit-qty').value = item.quantity;
            
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function updateEditedProduct() {
            const code = document.getElementById('edit-code').value;
            const name = document.getElementById('edit-name').value.trim();
            const category = document.getElementById('edit-cat').value.trim();
            const buyPrice = parseFloat(document.getElementById('edit-buy').value) || 0;
            const sellPrice = parseFloat(document.getElementById('edit-sell').value) || 0;
            const qty = parseInt(document.getElementById('edit-qty').value) || 0;

            if (!name) {
                alert("El nombre no puede estar vacío.");
                return;
            }

            if (qty <= 0) {
                if (!confirm("La cantidad es 0 o negativa. ¿Deseas eliminar este producto del inventario?")) {
                    return;
                }
                delete inventory[code];
            } else {
                inventory[code] = {
                    code: code,
                    name: name,
                    category: category,
                    buyPrice: buyPrice,
                    sellPrice: sellPrice,
                    quantity: qty
                };
            }

            saveStorage();
            updateTable();
            closeEditModal();
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        function deleteProduct(code) {
            if (confirm(`¿Estás seguro de eliminar el producto "${inventory[code].name}"?`)) {
                delete inventory[code];
                saveStorage();
                updateTable();
            }
        }

        function showStatus(text, colorClass) {
            const msg = document.getElementById('status-msg');
            msg.innerText = text;
            msg.className = `text-sm text-center font-semibold mb-4 ${colorClass}`;
            setTimeout(() => {
                msg.innerText = "Escanea un código de barras";
                msg.className = "text-sm text-center text-gray-500 mb-4";
            }, 3000);
        }

        function updateTable() {
            const tbody = document.getElementById('inventory-table');
            tbody.innerHTML = '';
            let count = 0;
            for (let code in inventory) {
                count++;
                const item = inventory[code];
                tbody.innerHTML += `
                    <tr class="border-b">
                        <td class="p-2">
                            <div class="font-bold">${item.name}</div>
                            <div class="text-xs text-gray-500">$${item.sellPrice} | Cód: ${item.code}</div>
                        </td>
                        <td class="p-2 text-center font-bold text-blue-600">${item.quantity}</td>
                        <td class="p-2 text-right">
                            <button onclick="editProduct('${code}')" class="bg-amber-500 text-white px-2 py-1 rounded text-xs font-semibold mr-1">Editar</button>
                            <button onclick="deleteProduct('${code}')" class="bg-red-500 text-white px-2 py-1 rounded text-xs font-semibold">X</button>
                        </td>
                    </tr>
                `;
            }
            document.getElementById('total-items').innerText = `${count} refs`;
        }

        function saveStorage() {
            localStorage.setItem('cigarreria_inv', JSON.stringify(inventory));
        }

        function exportCSV() {
            let csvContent = "data:text/csv;charset=utf-8,Codigo,Nombre,Categoria,P.Compra,P.Venta,Cantidad\n";
            for (let code in inventory) {
                const item = inventory[code];
                csvContent += `${item.code},"${item.name}","${item.category}",${item.buyPrice},${item.sellPrice},${item.quantity}\n`;
            }
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "inventario_cigarreria.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
